# Publica a plataforma na Vercel a cada push na main, acionando um Deploy Hook.
# Configuração: cadastre a URL do Deploy Hook em Settings > Secrets and variables > Actions,
# com o nome VERCEL_DEPLOY_HOOK.
name: Deploy na Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Aciona o Deploy Hook da Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Segredo VERCEL_DEPLOY_HOOK não configurado."
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
